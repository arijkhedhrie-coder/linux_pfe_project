<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IDPS Hybrid Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e0a;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#0a0e0a}
::-webkit-scrollbar-thumb{background:#1a3a1a;border-radius:2px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes flashIn{0%{opacity:0.2}100%{opacity:1}}
@keyframes slideIn{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes critFlash{0%{border-color:#e05252;box-shadow:inset 0 0 40px #e0525218}40%{border-color:#e05252;box-shadow:inset 0 0 60px #e0525230}100%{border-color:transparent;box-shadow:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>
const {useState,useEffect,useRef,useCallback}=React;

// ─── CONSTANTS (visual only, not data) ────────────────────────────────────────
const SEV_COLOR={CRITICAL:'#e05252',HIGH:'#f5a623',MED:'#3b9ef8',LOW:'#4a9a6a',INFO:'#4a6a8a'};
const SEV_BG={CRITICAL:'#2a1010',HIGH:'#2a1e0a',MED:'#0a1a2a',LOW:'#0a1e0a',INFO:'#0a0e14'};
const ENGINE_COLOR={SSH:'#3b9ef8',WEB:'#c87ad4',FTP:'#3ddc84',SESSION:'#f5a623',KERNEL:'#e05a8a',PREDICTION:'#e87a3a'};
const AGENT_COLORS={Orchestrateur:'#f5a623','Orchestrator':'#f5a623',Détecteur:'#e05252','Detector':'#e05252',Correcteur:'#e05a8a','Corrector':'#e05a8a',Analyste:'#3b9ef8','Analyst':'#3b9ef8',Rapporteur:'#3ddc84','Reporter':'#3ddc84',Collecteur:'#c87ad4','Collector':'#c87ad4'};
const THREAT_COLOR={CRITICAL:'#e05252',ELEVATED:'#f5a623',NORMAL:'#3ddc84'};
const THREAT_BG={CRITICAL:'#2a1010',ELEVATED:'#2a1e0a',NORMAL:'#0a1e0a'};
const TICK=12000;

// ─── ALERT SYSTEM ─────────────────────────────────────────────────────────────
const ALERT_THRESHOLDS={ssh_failures:12,blocked_ips:5,error_rate:6};
function useAlertSystem(kpis){
  const[toasts,setToasts]=useState([]);
  const[criticalFlash,setCriticalFlash]=useState(false);
  const prev=useRef({});
  useEffect(()=>{
    if(!kpis)return;
    const alerts=[];
    if(kpis.ssh_failures>ALERT_THRESHOLDS.ssh_failures&&(prev.current.ssh_failures||0)<=ALERT_THRESHOLDS.ssh_failures)
      alerts.push({id:Date.now()+'ssh',msg:`SSH failures spike: ${kpis.ssh_failures}/min`,color:'#3b9ef8'});
    if(kpis.blocked_ips>ALERT_THRESHOLDS.blocked_ips&&(prev.current.blocked_ips||0)<=ALERT_THRESHOLDS.blocked_ips)
      alerts.push({id:Date.now()+'bip',msg:`${kpis.blocked_ips} IPs blocked this session`,color:'#e05252'});
    if(alerts.length>0){
      setToasts(t=>[...t,...alerts].slice(-5));
      setCriticalFlash(true);setTimeout(()=>setCriticalFlash(false),2500);
    }
    prev.current=kpis;
  },[kpis]);
  const dismiss=id=>setToasts(t=>t.filter(x=>x.id!==id));
  return{toasts,criticalFlash,dismiss};
}

// ─── BACKEND & FETCH ──────────────────────────────────────────────────────────
const BACKEND_URL='';
function useBackendStatus(){
  const[status,setStatus]=useState('checking');
  const[lastPing,setLastPing]=useState(null);
  useEffect(()=>{
    const check=async()=>{
      try{
        const r=await fetch(`${BACKEND_URL}/api/health`,{signal:AbortSignal.timeout(1200)});
        if(r.ok){setStatus('connected');setLastPing(new Date().toTimeString().slice(0,8));}
        else setStatus('error');
      }catch{setStatus('disconnected');}
    };
    check();
    const id=setInterval(check,15000);
    return()=>clearInterval(id);
  },[]);
  return{status,lastPing};
}

// apiFetch: tries real API, returns null on failure (no mock fallback)
async function apiFetch(path){
  try{
    const r=await fetch(BACKEND_URL+path,{signal:AbortSignal.timeout(3000)});
    if(!r.ok)return null;
    return await r.json();
  }catch{return null;}
}

function useTick(){const[t,s]=useState(0);useEffect(()=>{const id=setInterval(()=>s(x=>x+1),TICK);return()=>clearInterval(id)},[]);return t}
function useClock(){const[t,s]=useState(new Date());useEffect(()=>{const id=setInterval(()=>s(new Date()),1000);return()=>clearInterval(id)},[]);return t}

// ─── DATA HOOKS (all real API, empty state if unavailable) ────────────────────
function useKPIs(){
  const tick=useTick();
  const[data,setData]=useState(null);
  const[flash,setFlash]=useState(false);
  useEffect(()=>{
    apiFetch('/api/kpis').then(d=>{
      setData(d);
      if(d){
        setFlash(true);
        setTimeout(()=>setFlash(false),800);
      }
    });
  },[tick]);
  const safe={
    available:false,
    missing_data:['No KPI data received from /api/kpis yet.'],
    health_score:null,
    ssh_failures:null,
    unique_attacking_ips:null,
    attack_velocity:null,
    ip_entropy:null,
    blocked_ips:null,
    alert_status:null,
    attack_pattern:'—',
    row_count:null,
    deduped_count:null,
    data_sources:[],
    ...(data||{})
  };
  return{data:safe,flash,loaded:data!==null};
}
function useAlarms(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/alarms').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}
function useScores(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/engine-scores').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}
function useLogs(){
  const tick=useTick();
  const[logs,setLogs]=useState([]);
  useEffect(()=>{
    apiFetch('/api/logs/stream').then(res=>{setLogs(res&&Array.isArray(res.lines)?res.lines:[]);});
  },[tick]);
  return logs;
}
function useSessions(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/sessions').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}
function useDecisions(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/decisions').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}
function useSuspiciousIPs(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/suspicious-ips').then(r=>{s(r&&Array.isArray(r.ips)?r.ips:[]);});},[tick]);
  return d;
}
function usePipelineLatest(){
  const tick=useTick();
  const[d,s]=useState(null);
  useEffect(()=>{apiFetch('/api/pipeline/latest').then(r=>{s(r||null);});},[tick]);
  return d;
}
function useTrust(){
  const tick=useTick();
  const[d,s]=useState(null);
  useEffect(()=>{apiFetch('/api/trust').then(r=>{s(r&&r.available!==false?r:null);});},[tick]);
  return d;
}
function useGateHistory(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/gate-history').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}
function useDataQuality(){
  const tick=useTick();
  const[d,s]=useState(null);
  useEffect(()=>{apiFetch('/api/data-quality').then(r=>{s(r&&r.available!==false?r:null);});},[tick]);
  return d;
}
function useBacktestHistory(){
  const tick=useTick();
  const[d,s]=useState([]);
  useEffect(()=>{apiFetch('/api/backtest-history').then(r=>{s(Array.isArray(r)?r:[]);});},[tick]);
  return d;
}

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────────
function Panel({children,style={}}){return React.createElement('div',{style:{background:'#0f160f',border:'1px solid #1a2a1a',borderRadius:8,padding:'14px 16px',...style}},children)}
function STitle({children,accent='#3ddc84'}){return React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:12}},React.createElement('div',{style:{width:2,height:12,background:accent,borderRadius:1}}),React.createElement('span',{style:{fontSize:9,fontWeight:600,color:'#4a7a4a',letterSpacing:'0.12em',textTransform:'uppercase'}},children))}
function P2Panel({children,style={}}){return React.createElement('div',{style:{background:'#0f160f',border:'1px solid #1a2a1a',borderRadius:8,padding:'14px 16px',...style}},children)}
function P2Title({children,accent='#3ddc84'}){return React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:12}},React.createElement('div',{style:{width:2,height:12,background:accent,borderRadius:1}}),React.createElement('span',{style:{fontSize:9,fontWeight:600,color:'#4a7a4a',letterSpacing:'0.12em',textTransform:'uppercase'}},children))}

function NoData({msg}){
  return React.createElement('div',{style:{color:'#2a4a2a',fontSize:10,padding:'20px 0',textAlign:'center',lineHeight:1.6}},
    msg||'No data — open http://localhost:5000/ after starting python backend/dashboard_api.py'
  );
}

function ToastStack({toasts,dismiss}){
  if(!toasts.length)return null;
  return React.createElement('div',{style:{position:'fixed',top:50,right:16,zIndex:9999,display:'flex',flexDirection:'column',gap:6}},
    toasts.map(t=>React.createElement('div',{key:t.id,onClick:()=>dismiss(t.id),style:{padding:'8px 14px',borderRadius:5,border:`1px solid ${t.color}60`,background:'#0d160d',color:t.color,fontSize:10,cursor:'pointer',fontFamily:'monospace',animation:'slideIn 0.3s ease',letterSpacing:'0.06em',minWidth:200}},
      React.createElement('span',{style:{opacity:0.5,marginRight:6}},t.ts?t.ts+' ·':''),t.msg
    ))
  );
}
function CriticalFlashOverlay({active}){
  if(!active)return null;
  return React.createElement('div',{style:{position:'fixed',inset:0,zIndex:9990,pointerEvents:'none',border:'2px solid transparent',animation:'critFlash 2.5s ease forwards'}});
}

function Gauge({value,max,color,label,sublabel,flash}){
  const pct=Math.max(0,Math.min(100,(value/max)*100));
  const r=32,cx=40,cy=40,circ=2*Math.PI*r;
  const dash=(pct/100)*circ*0.75;
  const offset=circ*0.125;
  return React.createElement('div',{style:{textAlign:'center',padding:'8px 4px'}},
    React.createElement('svg',{width:80,height:72,viewBox:'0 0 80 72'},
      React.createElement('circle',{cx,cy,r,fill:'none',stroke:'#1a2a1a',strokeWidth:5,strokeDasharray:`${circ*0.75} ${circ*0.25}`,strokeLinecap:'round',transform:`rotate(135 ${cx} ${cy})`}),
      React.createElement('circle',{cx,cy,r,fill:'none',stroke:color,strokeWidth:5,strokeDasharray:`${dash} ${circ-dash}`,strokeLinecap:'round',transform:`rotate(135 ${cx} ${cy})`,style:{transition:'stroke-dasharray 0.8s ease',filter:flash?`drop-shadow(0 0 4px ${color})`:'none'}}),
      React.createElement('text',{x:cx,y:cy+4,textAnchor:'middle',fill:color,fontSize:13,fontWeight:600,fontFamily:'monospace'},value!=null?Math.round(value):'—'),
      React.createElement('text',{x:cx,y:cy+16,textAnchor:'middle',fill:'#3a5a3a',fontSize:7,fontFamily:'monospace'},sublabel||'')
    ),
    React.createElement('div',{style:{fontSize:8,color:'#4a7a4a',letterSpacing:'0.06em',marginTop:-2}},label)
  );
}

function EngineBars({scores,dataAvailable}){
  if(!dataAvailable)return React.createElement(NoData,{msg:'No per-engine data — run python backend/main.py to produce session JSONL'});
  if(!scores.length)return React.createElement(NoData,{msg:'Latest pipeline run has no per-engine alarm counts'});
  return React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:8}},
    scores.map(s=>{
      const ec=ENGINE_COLOR[s.engine]||'#3ddc84';
      const sc=s.status==='ALARM'?'#e05252':'#3ddc84';
      return React.createElement('div',{key:s.engine},
        React.createElement('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:3}},
          React.createElement('span',{style:{fontSize:9,color:ec,fontFamily:'monospace',letterSpacing:'0.04em'}},s.engine),
          React.createElement('div',{style:{display:'flex',gap:8,alignItems:'center'}},
            React.createElement('span',{style:{fontSize:8,color:'#3a5a3a'}},`alarms: ${s.alarms}`),
            React.createElement('span',{style:{fontSize:8,padding:'1px 5px',borderRadius:3,background:'#0d160d',color:sc,border:`1px solid ${sc}40`}},s.status)
          )
        ),
        React.createElement('div',{style:{height:4,background:'#1a2a1a',borderRadius:2,overflow:'hidden'}},
          React.createElement('div',{style:{height:'100%',width:`${Math.min(100,(s.score||0)*20)}%`,background:ec,borderRadius:2,transition:'width 0.8s ease',opacity:0.8}})
        )
      );
    })
  );
}

function AlarmFeed({alarms,dataAvailable}){
  if(!dataAvailable)return React.createElement(NoData,{msg:'No alarm data yet — latest session has not been loaded from backend memory'});
  if(!alarms.length)return React.createElement('div',{style:{color:'#2a4a2a',fontSize:9,padding:'12px 0',textAlign:'center'}},'No alarms in latest real session');
  return React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:5}},
    alarms.slice(0,7).map((a,i)=>{
      const sc=SEV_COLOR[a.severity]||'#4a7a4a';
      const sb=SEV_BG[a.severity]||'#0a130a';
      return React.createElement('div',{key:a.id||i,style:{display:'grid',gridTemplateColumns:'52px 1fr auto',gap:8,alignItems:'start',padding:'7px 10px',background:i===0?sb:'#0a130a',borderRadius:5,border:`1px solid ${i===0?sc+'30':'#131e13'}`,animation:i===0?'slideIn 0.4s ease':undefined}},
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:8,padding:'1px 5px',borderRadius:3,textAlign:'center',fontWeight:600,background:sb,color:sc,letterSpacing:'0.08em'}},a.severity),
          React.createElement('div',{style:{fontSize:8,color:'#3a5a3a',marginTop:2,textAlign:'center'}},a.timestamp)
        ),
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:10,fontWeight:600,color:'#c8e8c8',marginBottom:2}},(a.type||'UNKNOWN').replace(/_/g,' ')),
          React.createElement('div',{style:{fontSize:9,color:'#5a8a5a',lineHeight:1.4}},a.human_insight||a.message||''),
          React.createElement('div',{style:{fontSize:8,color:'#4a6a4a',marginTop:2}},
            React.createElement('span',{style:{color:'#3b9ef8'}},a.source_ip||a.ip||''),' · ',a.engine||''
          )
        ),
        React.createElement('div',{style:{textAlign:'right'}},
          React.createElement('div',{style:{fontSize:8,padding:'2px 6px',borderRadius:3,background:'#1a2a1a',color:'#4a9a6a',letterSpacing:'0.05em',whiteSpace:'nowrap'}},a.action||'MONITOR'),
          React.createElement('div',{style:{fontSize:11,color:sc,fontWeight:600,marginTop:4}},typeof a.score==='number'?a.score.toFixed(0):'—')
        )
      );
    })
  );
}

function LogTerminal({logs}){
  const colorLine=l=>{
    if(l.includes('ERROR')||l.includes('CRITICAL')||l.includes('[ERROR'))return'#e05252';
    if(l.includes('WARN'))return'#f5a623';
    if(l.includes('COMPLETE')||l.includes('SUMMARY')||l.includes('DONE'))return'#3ddc84';
    if(l.includes('BRIDGE')||l.includes('AGENT')||l.includes('TRUST'))return'#f5a623';
    if(l.includes('PASS1')||l.includes('PASS2'))return'#e87a3a';
    return'#4a7a4a';
  };
  const visible=logs.slice(-16);
  if(!visible.length)return React.createElement('div',{style:{color:'#2a4a2a',fontSize:9,padding:'16px 0',textAlign:'center'}},'Waiting for pipeline — logs appear after main.py runs');
  return React.createElement('div',{style:{fontFamily:'monospace',fontSize:9,lineHeight:1.8,maxHeight:150,overflowY:'auto',color:'#3a6a3a'}},
    visible.map((line,i)=>React.createElement('div',{key:i,style:{color:i===visible.length-1?colorLine(line):'#3a5a3a',animation:i===visible.length-1?'slideIn 0.3s ease':undefined}},
      React.createElement('span',{style:{color:'#2a4a2a',marginRight:4}},'›'),line
    ))
  );
}

function HealthRing({score}){
  const hasScore=score!=null;
  const safeScore=hasScore?score:0;
  const r=36,cx=45,cy=45,circ=2*Math.PI*r,dash=(safeScore/100)*circ;
  const color=!hasScore?'#4a5a4a':score>80?'#3ddc84':score>60?'#f5a623':'#e05252';
  return React.createElement('div',{style:{position:'relative',width:90,height:90,flexShrink:0}},
    React.createElement('svg',{width:90,height:90,viewBox:'0 0 90 90'},
      React.createElement('circle',{cx,cy,r,fill:'none',stroke:'#1a2a1a',strokeWidth:6}),
      React.createElement('circle',{cx,cy,r,fill:'none',stroke:color,strokeWidth:6,strokeDasharray:`${dash} ${circ-dash}`,strokeLinecap:'round',transform:`rotate(-90 ${cx} ${cy})`,style:{transition:'stroke-dasharray 1s ease'}}),
      React.createElement('text',{x:cx,y:cy+2,textAnchor:'middle',fill:color,fontSize:16,fontWeight:600,fontFamily:'monospace'},hasScore?Math.round(score):'—'),
      React.createElement('text',{x:cx,y:cy+14,textAnchor:'middle',fill:'#3a5a3a',fontSize:7,fontFamily:'monospace'},'HEALTH')
    )
  );
}

// ─── PAGE 1: OVERVIEW ─────────────────────────────────────────────────────────
function OverviewPage(){
  const{data:kpis,flash,loaded}=useKPIs();
  const alarms=useAlarms(),scores=useScores(),logs=useLogs();
  const dq=useDataQuality();
  const pipelineReady=!!(kpis&&kpis.available);
  const critCount=alarms.filter(a=>a.severity==='CRITICAL').length;
  const highCount=alarms.filter(a=>a.severity==='HIGH').length;

  return React.createElement('div',{style:{padding:'14px 16px',display:'flex',flexDirection:'column',gap:12}},
    // Banner
    React.createElement('div',{style:{display:'flex',gap:10,alignItems:'stretch'}},
      React.createElement(Panel,{style:{flex:1,display:'flex',alignItems:'center',gap:16,padding:'12px 16px'}},
        React.createElement(HealthRing,{score:kpis.health_score}),
        React.createElement('div',null,
          React.createElement('div',{style:{fontSize:10,color:'#4a7a4a',marginBottom:4,letterSpacing:'0.08em'}},'SYSTEM STATUS'),
          React.createElement('div',{style:{fontSize:14,fontWeight:600,color:'#e8ffe8',marginBottom:6}},
            !loaded?'Connecting to local API…':
            !pipelineReady?'No backend session data yet':
            kpis.health_score>80?'Nominal Operations':
            kpis.health_score>60?'Elevated Threat Level':'Critical — Intervention Required'
          ),
          React.createElement('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},
            critCount>0&&React.createElement('span',{style:{fontSize:9,color:'#e05252',background:'#2a1010',padding:'2px 8px',borderRadius:3}},`${critCount} CRITICAL`),
            highCount>0&&React.createElement('span',{style:{fontSize:9,color:'#f5a623',background:'#2a1e0a',padding:'2px 8px',borderRadius:3}},`${highCount} HIGH`),
            React.createElement('span',{style:{fontSize:9,color:'#3a5a3a'}},pipelineReady?`${alarms.length} alarms in latest session`:'waiting for session_*.jsonl'),
            kpis.attack_pattern&&kpis.attack_pattern!=='—'&&React.createElement('span',{style:{fontSize:9,color:'#c87ad4',background:'#1a0a1a',padding:'2px 8px',borderRadius:3}},kpis.attack_pattern.replace(/_/g,' '))
          )
        ),
        !pipelineReady&&kpis.missing_data&&kpis.missing_data.length>0&&React.createElement('div',{style:{marginTop:8,fontSize:8,color:'#6a5a3a',lineHeight:1.6}},kpis.missing_data.join(' '))
      ),
      ...[
        {label:'Blocked IPs',value:kpis.blocked_ips,c:'#e05252'},
        {label:'Unique IPs',value:kpis.unique_attacking_ips,c:'#3b9ef8'},
        {label:'SSH alarms',value:kpis.ssh_failures,c:'#f5a623'},
        {label:'Attack velocity',value:kpis.attack_velocity,c:'#c87ad4'}
      ].map(s=>
        React.createElement(Panel,{key:s.label,style:{minWidth:90,textAlign:'center',display:'flex',flexDirection:'column',justifyContent:'center'}},
          React.createElement('div',{style:{fontSize:22,fontWeight:600,color:s.c,fontFamily:'monospace',animation:flash?'flashIn 0.6s':undefined}},
            s.value!=null?(typeof s.value==='number'&&!Number.isInteger(s.value)?s.value.toFixed(1):Math.round(s.value)):'—'
          ),
          React.createElement('div',{style:{fontSize:9,color:'#3a5a3a',marginTop:4,letterSpacing:'0.04em'}},s.label)
        )
      )
    ),
    // Ingestion visibility panel
    React.createElement(Panel,null,
      React.createElement(STitle,{accent:'#3b9ef8'},'Ingestion — Last Pipeline Run'),
      dq?React.createElement('div',{style:{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}},
        React.createElement('div',{style:{flex:1,minWidth:100,textAlign:'center'}},
          React.createElement('div',{style:{fontSize:18,fontWeight:600,color:'#3b9ef8',fontFamily:'monospace'}},(dq.raw_count||0).toLocaleString()),
          React.createElement('div',{style:{fontSize:9,color:'#3a5a3a',marginTop:2}},'Raw rows ingested')
        ),
        React.createElement('div',{style:{flex:1,minWidth:100,textAlign:'center'}},
          React.createElement('div',{style:{fontSize:18,fontWeight:600,color:'#c87ad4',fontFamily:'monospace'}},(dq.deduped_count||0).toLocaleString()),
          React.createElement('div',{style:{fontSize:9,color:'#3a5a3a',marginTop:2}},'After dedup'),
          React.createElement('div',{style:{fontSize:8,color:'#2a4a2a'}},`-${((dq.raw_count||0)-(dq.deduped_count||0)).toLocaleString()} duplicates`)
        ),
        React.createElement('div',{style:{flex:1,minWidth:100,textAlign:'center'}},

  {id:2,label:'Normalization + Dedup',module:'adapter.py + ip_profiler.py',event:'PIPELINE_START',color:'#c87ad4'},

];

function PipelinePg(){
  const pipeline=usePipelineLatest();
  const logs=useLogs();
  const[view,setView]=useState('pipeline');
  const[expanded,setExpanded]=useState(null);

  const events=pipeline?.events||[];
  const logLines=pipeline?.log_lines||[];

  // Map event types to which pipeline steps completed
  const completedEvents=new Set(events.map(e=>e.event_type));
  const pass2Skipped=completedEvents.has('DYNAMIC_CONFIG_DEFAULT')&&!completedEvents.has('PASS2_COMPLETE');

  const doneCount=PIPELINE_STEP_META.filter(s=>{
    if(s.id===7&&pass2Skipped)return false;
    return completedEvents.has(s.event);
  }).length;
  const total=pass2Skipped?PIPELINE_STEP_META.length-1:PIPELINE_STEP_META.length;
  const pct=total>0?Math.round(doneCount/total*100):0;

  // Extract key values from events for step detail
  function getEventData(eventType){
    return events.find(e=>e.event_type===eventType)||null;
  }

  function stepSummary(s){
    const ev=getEventData(s.event);
    if(!ev)return null;
    if(s.id===1)return`rows=${ev.row_count||0} servers=${ev.server_count||0} sources=${(ev.data_sources||[]).join(', ')}`;
    if(s.id===2)return`deduped=${ev.deduped_count||ev.row_count||0} noise=${((ev.noise_ratio||0)*100).toFixed(1)}% ml_weight=${(ev.ml_score_weight||1).toFixed(2)}`;
    if(s.id===3)return`health=${ev.health_score||0}% status=${ev.alert_status||'?'} pattern=${ev.attack_pattern||'?'} entropy=${ev.ip_entropy||0}`;
    if(s.id===4)return`alarms=${ev.alarm_count||0} by_domain=${JSON.stringify(ev.alarms_by_domain||{})}`;
    if(s.id===5)return`conf=${ev.confidence_in_metrics||0} label=${ev.confidence_label||'?'} fp_rate=${ev.false_positive_rate||0} drift=${ev.drift_score||0}`;
    if(s.id===6)return`threat=${ev.threat_level||'?'} ssh_override=${ev.ssh_high_override||null} rerun=${(ev.rerun_engines||[]).join(',')||'none'}`;
    if(s.id===7)return`alarms=${ev.alarm_count||0} delta=${ev.alarm_delta||0} engines=${(ev.engines_rerun||[]).join(',')}`;
    if(s.id===8)return(ev.result_excerpt||'').slice(0,100);
    if(s.id===9)return`elapsed=${ev.elapsed_seconds||0}s final_alarms=${ev.alarm_count||0} pass2=${ev.pass2_ran}`;
    return null;
  }

  return React.createElement('div',{style:{padding:'14px 16px',height:'100%',overflowY:'auto',display:'flex',flexDirection:'column',gap:12}},
    // Progress bar
    React.createElement(P2Panel,{style:{display:'flex',alignItems:'center',gap:16}},
      React.createElement('div',{style:{flex:1}},
        React.createElement('div',{style:{fontSize:9,color:'#3a5a3a',marginBottom:4,letterSpacing:'0.08em'}},'PIPELINE PROGRESS — last run'),
        React.createElement('div',{style:{height:4,background:'#151f15',borderRadius:2,overflow:'hidden'}},
          React.createElement('div',{style:{height:'100%',width:`${pct}%`,background:'#3ddc84',borderRadius:2,transition:'width 0.4s'}})
        )
      ),
      React.createElement('div',{style:{fontSize:22,fontWeight:600,color:'#3ddc84',fontFamily:'monospace'}},`${pct}%`),
      React.createElement('div',{style:{fontSize:9,color:'#3a5a3a'}},`${doneCount} / ${total} steps`),
      events.length===0&&React.createElement('div',{style:{fontSize:9,color:'#2a4a2a'}},'No pipeline data yet — run python main.py')
    ),
    // Sub-tab bar

function RealLogTerminalFull({lines}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[lines]);
  const color=l=>{
    if(l.includes('[ERROR')||l.includes('CRITICAL'))return'#e05252';
    if(l.includes('[WARN'))return'#f5a623';
    if(l.includes('COMPLETE')||l.includes('SUMMARY')||l.includes('DONE'))return'#3ddc84';
    if(l.includes('TRUST')||l.includes('AGENT')||l.includes('CREW'))return'#f5a623';

  if(!lines.length)return React.createElement(NoData,{msg:'No log data — run python main.py to generate session_*.jsonl'});

}
