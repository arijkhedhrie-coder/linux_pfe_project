// ─── MOCK DATA ────────────────────────────────────────────────────────────────
function rand(min,max,d=1){return parseFloat((Math.random()*(max-min)+min).toFixed(d))}
function jitter(base,pct=0.12){return parseFloat((base*(1+(Math.random()-0.5)*pct*2)).toFixed(1))}

const ATTACK_TYPES=[
  {type:'BRUTE_FORCE_SSH',engine:'SSH',insight:'Repeated login failures from single IP — credential stuffing pattern.'},
  {type:'WEB_ENUMERATION',engine:'WEB',insight:'Suspicious path scanning — likely automated vulnerability scanner.'},
  {type:'FTP_EXFIL',engine:'FTP',insight:'Abnormal download rate — possible data exfiltration in progress.'},
  {type:'SESSION_HIJACK',engine:'SESSION',insight:'Anomalous session token reuse across multiple IPs — session compromise.'},
  {type:'KERNEL_PANIC',engine:'KERNEL',insight:'Kernel error spike — system instability may precede crash.'},
  {type:'PORT_SCAN',engine:'SSH',insight:'Sequential port probing — reconnaissance phase detected.'},
  {type:'BOTNET_WARMUP',engine:'PREDICTION',insight:'Rising unique IPs, low per-IP attempts — distributed attack imminent.'},
  {type:'SPRAY_PHASE',engine:'PREDICTION',insight:'Username diversity spiking — password spray attack incoming.'},
];
const IPS=['192.168.1.55','10.0.0.42','172.16.0.88','192.168.2.11','10.10.5.200'];
const SEVS=['CRITICAL','HIGH','HIGH','MED','MED','LOW','LOW','INFO'];
const SEV_COLOR={CRITICAL:'#e05252',HIGH:'#f5a623',MED:'#3b9ef8',LOW:'#4a9a6a',INFO:'#4a6a8a'};
const SEV_BG={CRITICAL:'#2a1010',HIGH:'#2a1e0a',MED:'#0a1a2a',LOW:'#0a1e0a',INFO:'#0a0e14'};
const ENGINE_COLOR={SSH:'#3b9ef8',WEB:'#c87ad4',FTP:'#3ddc84',SESSION:'#f5a623',KERNEL:'#e05a8a',PREDICTION:'#e87a3a'};
const ACTIONS={CRITICAL:'BLOCK_NOW',HIGH:'ESCALATE',MED:'WATCHLIST',LOW:'MONITOR',INFO:'LOG_ONLY'};

function genKPIs(){return{cpu_load:rand(55,94),ssh_failures:rand(2,18,0),active_connections:rand(80,180,0),error_rate:rand(0,8),blocked_ips:rand(1,7,0),health_score:rand(62,97)}}

function genAlarms(n=8){
  return Array.from({length:n},(_,i)=>{
    const atk=ATTACK_TYPES[Math.floor(Math.random()*ATTACK_TYPES.length)];
    const sev=SEVS[Math.floor(Math.random()*8)];
    const score=rand(22,95);
    const ts=new Date(Date.now()-i*45000).toTimeString().slice(0,8);
    return{id:`a${Date.now()}${i}`,timestamp:ts,type:atk.type,source_ip:IPS[Math.floor(Math.random()*IPS.length)],severity:sev,engine:atk.engine,score,message:`Score ${score}`,human_insight:atk.insight,action:ACTIONS[sev]};
  }).sort((a,b)=>({CRITICAL:0,HIGH:1,MED:2,LOW:3,INFO:4}[a.severity]-{CRITICAL:0,HIGH:1,MED:2,LOW:3,INFO:4}[b.severity]));
}

function genScores(){
  return['SSH','WEB','FTP','SESSION','KERNEL','PREDICTION'].map(engine=>{
    const p1=rand(10,90),p2=jitter(p1,0.3),score=Math.max(p1,p2);
    return{engine,score,pass1:p1,pass2:p2,alarms:Math.floor(rand(0,12,0)),status:score>60?'BLOCK':score>35?'WATCH':'CLEAR'};
  });
}

function genTrend(n=48){
  let ssh=30,web=20,ftp=10,kernel=5,pred=15,health=85;
  return Array.from({length:n},(_,i)=>{
    ssh=Math.max(0,Math.min(100,ssh+rand(-8,8)));
    web=Math.max(0,Math.min(100,web+rand(-6,7)));
    ftp=Math.max(0,Math.min(100,ftp+rand(-4,6)));
    kernel=Math.max(0,Math.min(100,kernel+rand(-3,5)));
    pred=Math.max(0,Math.min(100,pred+rand(-5,7)));
    health=Math.max(40,Math.min(100,health-(ssh+web)/40+rand(-3,3)));
    const min=(n-i)*30,t=new Date(Date.now()-min*60000);
    return{time:`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`,ssh,web,ftp,kernel,prediction:pred,health};
  });
}

// ─── GLOBAL ALERT SYSTEM ──────────────────────────────────────────────────────
const ALERT_THRESHOLDS={cpu_load:85,ssh_failures:12,blocked_ips:5,error_rate:6};

function useAlertSystem(kpis){
  const[toasts,setToasts]=useState([]);
  const[criticalFlash,setCriticalFlash]=useState(false);
  const prevRef=useRef({});
  useEffect(()=>{
    if(!kpis)return;
    const newToasts=[];
    Object.entries(ALERT_THRESHOLDS).forEach(([key,thresh])=>{
      const val=kpis[key];
      const wasOver=(prevRef.current[key]||0)>thresh;
      if(val>thresh&&!wasOver){
        newToasts.push({id:`${key}-${Date.now()}`,key,val:val.toFixed?val.toFixed(1):val,thresh,ts:new Date().toTimeString().slice(0,8)});
      }
    });
    if(newToasts.length>0){
      setCriticalFlash(true);
      setTimeout(()=>setCriticalFlash(false),2500);
      setToasts(prev=>[...newToasts,...prev].slice(0,5));
    }
    prevRef.current={...kpis};
  },[kpis]);
  const dismiss=useCallback(id=>setToasts(prev=>prev.filter(t=>t.id!==id)),[]);
  return{toasts,criticalFlash,dismiss};
}

function ToastStack({toasts,dismiss}){
  if(!toasts.length)return null;
  const labels={cpu_load:'CPU Load',ssh_failures:'SSH Failures/min',blocked_ips:'Blocked IPs',error_rate:'Error Rate'};
  return React.createElement('div',{style:{position:'fixed',top:50,right:16,zIndex:999,display:'flex',flexDirection:'column',gap:6}},
    toasts.map(t=>React.createElement('div',{key:t.id,style:{background:'#1a0a0a',border:'1px solid #e05252',borderRadius:6,padding:'10px 14px',display:'flex',alignItems:'center',gap:10,minWidth:240,animation:'slideIn 0.3s ease',boxShadow:'0 0 20px #e0525230'}},
      React.createElement('div',{style:{width:8,height:8,borderRadius:'50%',background:'#e05252',animation:'pulse 0.8s infinite',flexShrink:0}}),
      React.createElement('div',{style:{flex:1}},
        React.createElement('div',{style:{fontSize:10,fontWeight:600,color:'#e05252',letterSpacing:'0.06em'}},'THRESHOLD EXCEEDED'),
        React.createElement('div',{style:{fontSize:9,color:'#c87a7a',marginTop:2}},`${labels[t.key]||t.key}: ${t.val} > ${t.thresh}`)
      ),
      React.createElement('button',{onClick:()=>dismiss(t.id),style:{background:'none',border:'none',color:'#5a3a3a',cursor:'pointer',fontSize:12,padding:0}},'✕')
    ))
  );
}

// ─── BACKEND STATUS INDICATOR ─────────────────────────────────────────────────
const BACKEND_URL='http://localhost:5000';
function useBackendStatus(){
  const[status,setStatus]=useState('mock');
  const[lastPing,setLastPing]=useState(null);
  useEffect(()=>{
    const check=async()=>{
      try{
        const r=await fetch(`${BACKEND_URL}/api/health`,{signal:AbortSignal.timeout(1200)});
        setStatus(r.ok?'connected':'error');
      }catch{setStatus('mock');}
      setLastPing(new Date().toTimeString().slice(0,8));
    };
    check();
    const id=setInterval(check,30000);
    return()=>clearInterval(id);
  },[]);
  return{status,lastPing};
}




// ─── HOOKS ────────────────────────────────────────────────────────────────────
function useTick(){const[t,s]=useState(0);useEffect(()=>{const id=setInterval(()=>s(x=>x+1),TICK);return()=>clearInterval(id)},[]);return t}
function useClock(){const[t,s]=useState(new Date());useEffect(()=>{const id=setInterval(()=>s(new Date()),1000);return()=>clearInterval(id)},[]);return t}

// Generic API fetch with mock fallback
async function apiFetch(path,mockFn){
  try{
    const r=await fetch(BACKEND_URL+path,{signal:AbortSignal.timeout(2000)});
    if(!r.ok)throw new Error('bad status');
    return await r.json();
  }catch{return mockFn();}
}

function useKPIs(){
  const tick=useTick();
  const[data,setData]=useState(genKPIs);
  const[flash,setFlash]=useState(false);
  useEffect(()=>{
    apiFetch('/api/kpis',genKPIs).then(d=>{setData(d);setFlash(true);setTimeout(()=>setFlash(false),800);});
  },[tick]);
  return{data,flash};
}
function useAlarms(){
  const tick=useTick();
  const[d,s]=useState(()=>genAlarms(8));
  useEffect(()=>{apiFetch('/api/alarms',()=>genAlarms(8)).then(res=>s(res.length?res:genAlarms(8)));},[tick]);
  return d;
}

  const tick=useTick();
  const[d,s]=useState(genScores);

}

  const[h,setH]=useState(()=>genTrend(48));
  useEffect(()=>{setH(prev=>{const last=prev[prev.length-1];return[...prev.slice(1),{time:new Date().toTimeString().slice(0,5),ssh:Math.max(0,Math.min(100,last.ssh+(Math.random()-.45)*12)),web:Math.max(0,Math.min(100,last.web+(Math.random()-.45)*10)),ftp:Math.max(0,Math.min(100,last.ftp+(Math.random()-.45)*7)),kernel:Math.max(0,Math.min(100,last.kernel+(Math.random()-.45)*5)),prediction:Math.max(0,Math.min(100,last.prediction+(Math.random()-.45)*8)),health:Math.max(40,Math.min(100,last.health+(Math.random()-.5)*5))}]});},[tick]);
  return h;
}
function useLogs(){
  const tick=useTick();
  const[logs,setLogs]=useState([]);
  useEffect(()=>{
    apiFetch('/api/logs/stream',null).then(res=>{
      if(res&&res.lines&&res.lines.length){setLogs(res.lines);}
      else{
        const ip=IPS[Math.floor(Math.random()*IPS.length)],n=Math.floor(Math.random()*200);
        const tmpl=LOG_TEMPLATES[Math.floor(Math.random()*LOG_TEMPLATES.length)];
        const line=`${new Date().toTimeString().slice(0,8)} `+tmpl.replace('{ip}',ip).replace('{n}',String(n));
        setLogs(prev=>[...prev.slice(-60),line]);
      }
    });
  },[tick]);
  return logs;
}

function Gauge({value,max,color,label,sublabel,flash}){
  const r=44,cx=60,cy=58;
  const startA=-215,endA=35,total=endA-startA;
  const pct=Math.min(value/max,1);
  const toRad=d=>d*Math.PI/180;
  const arc=(s,e)=>{const sr=toRad(s),er=toRad(e),x1=cx+r*Math.cos(sr),y1=cy+r*Math.sin(sr),x2=cx+r*Math.cos(er),y2=cy+r*Math.sin(er),lg=e-s>180?1:0;return`M${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2}`};
  const filledEnd=startA+pct*total,isHigh=pct>0.8;
  const disp=typeof value==='number'&&!Number.isInteger(value)?value.toFixed(1):Math.round(value);
  return React.createElement('div',{style:{textAlign:'center',animation:flash?'flashIn 0.6s ease':undefined}},
    React.createElement('svg',{width:120,height:90,viewBox:'0 0 120 90'},
      React.createElement('path',{d:arc(startA,endA),fill:'none',stroke:'#1a2a1a',strokeWidth:5,strokeLinecap:'round'}),
      React.createElement('path',{d:arc(startA,filledEnd),fill:'none',stroke:isHigh?'#e05252':color,strokeWidth:5,strokeLinecap:'round'}),
      React.createElement('text',{x:cx,y:cy+4,textAnchor:'middle',fill:isHigh?'#e05252':'#e8ffe8',fontSize:18,fontWeight:600,fontFamily:'monospace'},disp),
      isHigh&&React.createElement('circle',{cx:cx+18,cy:cy-16,r:4,fill:'#e05252',opacity:0.8},
        React.createElement('animate',{attributeName:'opacity',values:'0.8;0.2;0.8',dur:'1s',repeatCount:'indefinite'})

function TrendChart({data}){
  if(!data.length)return null;
  const W=580,H=120;
  const keys=['ssh','web','ftp','kernel','prediction'];
  const colors={ssh:'#3b9ef8',web:'#c87ad4',ftp:'#3ddc84',kernel:'#e05a8a',prediction:'#f5a623'};
  const sx=i=>(i/(data.length-1))*W,sy=v=>H-(v/100)*H;
  const toP=k=>data.map((d,i)=>`${i===0?'M':'L'}${sx(i)},${sy(d[k])}`).join(' ');
  const toA=k=>toP(k)+` L${sx(data.length-1)},${H} L0,${H} Z`;
  const step=Math.floor(data.length/6);
  return React.createElement('svg',{width:'100%',viewBox:`0 0 ${W} ${H+24}`,style:{display:'block'}},
    [0,25,50,75,100].map(v=>React.createElement('g',{key:v},
      React.createElement('line',{x1:0,x2:W,y1:sy(v),y2:sy(v),stroke:'#151f15',strokeWidth:1}),
      React.createElement('text',{x:2,y:sy(v)-2,fill:'#2a4a2a',fontSize:8,fontFamily:'monospace'},v)
    )),
    keys.map(k=>React.createElement('g',{key:k},
      React.createElement('path',{d:toA(k),fill:colors[k],fillOpacity:0.07}),
      React.createElement('path',{d:toP(k),fill:'none',stroke:colors[k],strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})
    )),
    data.map((d,i)=>i%step===0&&React.createElement('text',{key:i,x:sx(i),y:H+16,fill:'#3a5a3a',fontSize:8,fontFamily:'monospace',textAnchor:'middle'},d.time)),
    keys.map(k=>React.createElement('circle',{key:`dot-${k}`,cx:sx(data.length-1),cy:sy(data[data.length-1][k]),r:3,fill:colors[k]},
      React.createElement('animate',{attributeName:'opacity',values:'1;0.3;1',dur:'1.5s',repeatCount:'indefinite'})

}

function ThresholdHistoryChart({sessions}){
  if(!sessions.length)return null;
  const W=360,H=80;
  const healthVals=sessions.map(s=>s.health).reverse();
  const maxH=100,minH=Math.min(...healthVals)-5;
  const sx=i=>(i/(healthVals.length-1))*W;
  const sy=v=>H-((v-minH)/(maxH-minH))*H;
  const pathD=healthVals.map((v,i)=>`${i===0?'M':'L'}${sx(i)},${sy(v)}`).join(' ');
  const areaD=pathD+` L${sx(healthVals.length-1)},${H} L0,${H} Z`;
  return React.createElement('div',null,
    React.createElement('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},
      React.createElement('span',{style:{fontSize:9,color:'#3a5a3a'}},'Health score trend across sessions'),
      React.createElement('span',{style:{fontSize:9,color:'#4a6a4a'}}),
    ),
    React.createElement('svg',{width:'100%',viewBox:`0 0 ${W} ${H+4}`,style:{display:'block'}},
      [40,60,80,100].map(v=>React.createElement('g',{key:v},
        React.createElement('line',{x1:0,x2:W,y1:sy(v),y2:sy(v),stroke:'#151f15',strokeWidth:1}),
        React.createElement('text',{x:2,y:sy(v)-2,fill:'#2a4a2a',fontSize:7,fontFamily:'monospace'},v)
      )),
      React.createElement('path',{d:areaD,fill:'#3ddc84',fillOpacity:0.08}),
      React.createElement('path',{d:pathD,fill:'none',stroke:'#3ddc84',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'}),
      sessions.filter(s=>s.threat!=='NORMAL').reverse().map((s,i)=>{
        const idx=sessions.length-1-sessions.filter(x=>x.threat!=='NORMAL').indexOf(s);
        return React.createElement('circle',{key:i,cx:sx(idx),cy:sy(s.health),r:3,fill:THREAT_COLOR[s.threat]})
      })
    ),
    React.createElement('div',{style:{display:'flex',gap:10,marginTop:6}},

          React.createElement('div',{style:{width:6,height:6,borderRadius:'50%',background:x.c}}),x.l
        )
      )
    )
  );
}

function usePipelineState(){
  const[activeStep,setActiveStep]=useState(0);
  const[stepStatus,setStepStatus]=useState({});
  const[running,setRunning]=useState(false);
  const[logs,setLogs]=useState([]);
  const[logStep,setLogStep]=useState(-1);
  const intervalRef=useRef(null);

  const startRun=useCallback(()=>{
    setActiveStep(0);setStepStatus({});setLogs([]);setLogStep(-1);setRunning(true);
    let step=0,logIdx=0;
    const tick=()=>{
      if(step>=PIPELINE_STEPS.length){setRunning(false);clearInterval(intervalRef.current);return;}
      const s=PIPELINE_STEPS[step];
      setActiveStep(step);setLogStep(step);
      if(logIdx<s.logLines.length){
        const line=`[${s.step}/${PIPELINE_STEPS.length}] ${s.logLines[logIdx]}`;
        setLogs(prev=>[...prev.slice(-80),{text:line,step:step,ts:new Date().toTimeString().slice(0,8)}]);
        logIdx++;
      } else {
        setStepStatus(prev=>({...prev,[step]:'done'}));
        step++;logIdx=0;
      }
    };
    intervalRef.current=setInterval(tick,340);
    return()=>clearInterval(intervalRef.current);
  },[]);

  const reset=useCallback(()=>{
    clearInterval(intervalRef.current);
    setActiveStep(-1);setStepStatus({});setLogs([]);setRunning(false);setLogStep(-1);
  },[]);

  useEffect(()=>()=>clearInterval(intervalRef.current),[]);
  return{activeStep,stepStatus,running,logs,logStep,startRun,reset};
}

function PipelineLogTerminal({logs,running}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[logs]);
  const getColor=l=>{
    const s=l.step;
    if(l.text.includes('ERROR')||l.text.includes('CRITICAL'))return'#e05252';
    if(l.text.includes('WARN'))return'#f5a623';
    if(l.text.includes('COMPLETE')||l.text.includes('SUMMARY'))return'#3ddc84';
    return STEP_COLORS[s+1]||'#4a7a4a';

  return React.createElement('div',{ref,style:{fontFamily:'monospace',fontSize:9,lineHeight:1.8,height:320,overflowY:'auto',background:'#060d06',borderRadius:5,padding:'10px 12px',border:'1px solid #131e13'}},

          React.createElement('div',{style:{width:26,height:26,borderRadius:6,background:'#0d2a1a',border:'1px solid #2a5a3a',display:'flex',alignItems:'center',justifyContent:'center'}},
            React.createElement('svg',{width:13,height:13,viewBox:'0 0 14 14',fill:'none'},
              React.createElement('path',{d:'M7 1L13 4.5V9.5L7 13L1 9.5V4.5L7 1Z',stroke:'#3ddc84',strokeWidth:1.2}),
              React.createElement('circle',{cx:7,cy:7,r:2,fill:'#3ddc84'})
            )

          React.createElement('div',null,
            React.createElement('div',{style:{fontSize:11,fontWeight:600,color:'#e8ffe8',letterSpacing:'0.08em'}},'IDPS'),
            React.createElement('div',{style:{fontSize:9,color:'#4a7a4a',letterSpacing:'0.06em'}},'HYBRID v4')
          )

      // Nav
      React.createElement('nav',{style:{padding:'10px 8px',flex:1}},
        NAV.map(item=>{
          const act=page===item.id;
          return React.createElement('button',{key:item.id,onClick:()=>setPage(item.id),style:{display:'flex',alignItems:'center',gap:10,width:'100%',padding:'9px 10px',marginBottom:2,borderRadius:6,border:'none',cursor:'pointer',textAlign:'left',background:act?'#1a2e1a':'transparent',color:act?'#3ddc84':'#4a6a4a',borderLeft:act?'2px solid #3ddc84':'2px solid transparent',transition:'all 0.15s'}},
            React.createElement('div',null,
              React.createElement('div',{style:{fontSize:12,fontWeight:act?600:400,letterSpacing:'0.04em'}},item.label),
              React.createElement('div',{style:{fontSize:9,color:act?'#4a9a5a':'#3a5a3a',marginTop:1}},item.sub)
            )
          );
        })
      ),
      // Clock
      React.createElement('div',{style:{padding:'12px 16px',borderTop:'1px solid #1a2a1a'}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:6}},
          React.createElement('div',{style:{width:7,height:7,borderRadius:'50%',background:'#3ddc84',animation:'pulse 2s infinite'}}),
          React.createElement('span',{style:{fontSize:9,color:'#3ddc84',letterSpacing:'0.1em'}},'LIVE')
        ),
        React.createElement('div',{style:{fontSize:18,fontWeight:500,color:'#e8ffe8',letterSpacing:'0.08em',fontFamily:'monospace'}},time.toTimeString().slice(0,8)),
        React.createElement('div',{style:{fontSize:9,color:'#3a5a3a',marginTop:2}},time.toDateString()),
        React.createElement('div',{style:{marginTop:8,fontSize:9,color:'#2a4a2a'}},'CrewAI · AWS · 6-agent')
      )
    ),
    // Main
    React.createElement('div',{style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}},
      // Topbar
      React.createElement('header',{style:{height:42,flexShrink:0,borderBottom:'1px solid #1a2a1a',background:'#0d120d',display:'flex',alignItems:'center',padding:'0 20px',justifyContent:'space-between'}},
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8}},
          React.createElement('span',{style:{fontSize:11,color:'#3a5a3a'}},page==='overview'?'Main Overview':page==='ai'?'AI Control Panel':'Pipeline View'),
          React.createElement('span',{style:{fontSize:11,color:'#2a4a2a'}},'·'),
          React.createElement('span',{style:{fontSize:10,color:'#2a4a2a'}},'Hybrid IDPS')
        ),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:12}},
          // Backend status
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:5}},
            React.createElement('div',{style:{width:6,height:6,borderRadius:'50%',background:bsColor,animation:backendStatus==='checking'?'pulse 0.8s infinite':undefined}}),
            React.createElement('span',{style:{fontSize:9,color:bsColor,letterSpacing:'0.08em'}},bsLabel),
            lastPing&&React.createElement('span',{style:{fontSize:8,color:'#2a4a2a'}},lastPing)
          ),

          React.createElement('button',{onClick:onReplay,style:{padding:'3px 10px',borderRadius:4,border:'1px solid #1a3a2a',background:'#0a160a',color:'#4a8a5a',fontSize:9,cursor:'pointer',fontFamily:'monospace',letterSpacing:'0.06em'}},'⟳ REPLAY'),

          )
        )
      ),
      // Content
      React.createElement('div',{style:{flex:1,overflow:'auto'}},children)
    )
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App(){
  const[page,setPage]=useState('overview');
  const[showReplay,setShowReplay]=useState(false);
  const{data:kpis}=useKPIs();
  const{toasts,criticalFlash,dismiss}=useAlertSystem(kpis);
  const{status:backendStatus,lastPing}=useBackendStatus();

  const content=page==='overview'?React.createElement(OverviewPage):page==='ai'?React.createElement(AIPage):React.createElement(PipelinePg);
  return React.createElement(React.Fragment,null,
    React.createElement(Layout,{page,setPage,onReplay:()=>setShowReplay(true),backendStatus,lastPing,criticalFlash},content),
    React.createElement(ToastStack,{toasts,dismiss}),
    criticalFlash&&React.createElement(CriticalFlashOverlay,{active:criticalFlash}),
    showReplay&&React.createElement(SessionReplayModal,{onClose:()=>setShowReplay(false)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
